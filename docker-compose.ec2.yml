services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.ec2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    build:
      context: ./deploy/pgbouncer
    restart: unless-stopped
    env_file:
      - .env.ec2
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    restart: "no"
    env_file:
      - .env.ec2
    environment:
      DB_USE_PGBOUNCER: 0
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.ec2
    environment:
      DB_USE_PGBOUNCER: 1
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
    command: /app/deploy/entrypoint.sh
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "80:8000"

  celery_worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env.ec2
    environment:
      DB_USE_PGBOUNCER: 1
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
    command: celery -A core worker -l info
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery_beat:
    build: .
    restart: unless-stopped
    env_file:
      - .env.ec2
    environment:
      DB_USE_PGBOUNCER: 1
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
    command: celery -A core beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
